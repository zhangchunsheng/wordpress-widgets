<body>
  <main id="dse-wrap" role="main">
    <h1 class="sr-only">每日英语句子 - 爱词霸每日一句英语励志名言</h1>
    <article id="dse-card" itemscope itemtype="https://schema.org/CreativeWork">
      <header id="dse-header">
        <div id="dse-header-left">
          <svg id="dse-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3C12 3 5 7 5 13.5C5 17.5 8.1 21 12 21C15.9 21 19 17.5 19 13.5C19 7 12 3 12 3Z" fill="#7cb370"/>
            <path d="M12 21V13M12 13L8 9" stroke="#c8e6c0" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span id="dse-title" itemprop="name">Daily English</span>
        </div>
        <time id="dse-date-badge" datetime="">今日</time>
      </header>

      <div id="dse-status" aria-live="polite">
        <span class="dse-spinner"></span>正在获取今日句子…
      </div>
      <div id="dse-body" style="display:none;">
        <div id="dse-img-wrap" style="display:none;">
          <img id="dse-img" alt="每日英语配图" itemprop="image" />
        </div>
        <blockquote id="dse-content" itemprop="description"></blockquote>
        <p id="dse-note" itemprop="author"></p>
      </div>

      <footer id="dse-footer">
        <span id="dse-source">数据来源：<a href="https://www.luomor.com/" target="_blank">烙馍网</a></span>
        <div id="dse-pick-wrap">
          <input type="date" id="dse-dateinput" aria-label="选择日期查询历史句子" />
          <button id="dse-btn" type="button">查询</button>
        </div>
      </footer>
    </article>
  </main>

  <script>
  (function(){
    const $ = (id) => document.getElementById(id);
    const todayStr = new Date().toISOString().split('T')[0];
    $('dse-dateinput').value = todayStr;
    $('dse-date-badge').datetime = todayStr;
    $('dse-date-badge').textContent = todayStr;

    function fetchSentence(dateStr){
      const status = $('dse-status');
      const body = $('dse-body');
      status.style.display = 'block';
      status.innerHTML = '<span class="dse-spinner"></span>正在获取句子…';
      status.className = '';
      body.style.display = 'none';

      const cbName = 'icibaCb_' + Date.now();
      const script = document.createElement('script');
      let done = false;

      window[cbName] = function(data){
        done = true;
        cleanup();
        if(data && data.content){
          $('dse-content').textContent = data.content;
          $('dse-note').textContent = data.note || '';
          const imgWrap = $('dse-img-wrap');
          const img = $('dse-img');
          if(data.fenxiang_img){
            img.src = data.fenxiang_img;
            imgWrap.style.display = 'block';
            img.onerror = () => { imgWrap.style.display = 'none'; };
          } else {
            imgWrap.style.display = 'none';
          }
          status.style.display = 'none';
          body.style.display = 'block';
          $('dse-date-badge').textContent = dateStr;
          $('dse-date-badge').datetime = dateStr;
          // 更新页面 title 为当日句子前 20 字
          const shortText = data.content.substring(0, 20) + (data.content.length > 20 ? '...' : '');
          document.title = shortText + ' - 每日英语句子';
        } else {
          status.className = 'dse-error';
          status.innerHTML = '未找到该日期的句子，请尝试其他日期。';
        }
      };

      function cleanup(){
        if(script.parentNode) script.parentNode.removeChild(script);
        try { delete window[cbName]; } catch(e){ window[cbName] = undefined; }
      }

      const ts = Date.now();
      script.src = `https://sentence.iciba.com/index.php?callback=${cbName}&c=dailysentence&m=getdetail&title=${dateStr}&_=${ts}`;
      script.onerror = function(){
        if(done) return;
        cleanup();
        status.className = 'dse-error';
        status.innerHTML = '获取失败，请稍后重试。';
      };

      setTimeout(function(){
        if(!done){
          cleanup();
          status.className = 'dse-error';
          status.innerHTML = '请求超时，请稍后重试。';
        }
      }, 6000);

      document.head.appendChild(script);
    }

    $('dse-btn').addEventListener('click', function(){
      const d = $('dse-dateinput').value;
      if(d) fetchSentence(d);
    });

    fetchSentence(todayStr);
  })();
  </script>
